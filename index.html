<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friend Vote 2026</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(
        180deg,
        #17358f 0%,
        #102878 38%,
        #050b24 100%
    );
    color:#fff;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:20px 14px 60px;
}

/* ================= LOGO ================= */

.logo{
    text-align:center;
    padding:18px 10px 28px;
}

.logo-icon{
    width:78px;
    height:78px;
    margin:auto;

    border-radius:50%;
    border:2px solid rgba(255,255,255,.8);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;
    font-weight:800;

    box-shadow:0 0 25px rgba(255,255,255,.12);
}

.logo h1{
    margin-top:15px;

    font-size:34px;
    font-weight:800;

    letter-spacing:2px;
}

.logo p{
    margin-top:5px;

    font-size:13px;

    letter-spacing:6px;

    opacity:.8;
}

/* ================= TITLE ================= */

.section-title{
    text-align:center;

    font-size:27px;

    font-weight:700;

    margin:4px 0 22px;
}

/* ================= TOP 1 ================= */

.top-one{
    background:#000;

    border:2px solid #454545;

    border-radius:20px;

    padding:14px;

    margin-bottom:22px;

    box-shadow:0 12px 35px rgba(0,0,0,.35);
}

.top-photo{
    width:100%;

    height:430px;

    object-fit:cover;

    border-radius:15px;

    display:block;

    background:#202020;
}

.top-info{
    position:relative;

    padding:20px 8px 5px;
}

.top-city{
    font-size:27px;

    font-weight:700;
}

.top-name{
    color:#aaa;

    font-size:19px;

    margin-top:9px;
}


/* =========================================
   BEAUTIFUL TOP RANK NUMBER
========================================= */

.top-number{
    position:absolute;

    right:8px;
    top:8px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:64px;

    font-weight:400;

    font-style:italic;

    line-height:1;

    letter-spacing:-3px;

    color:#f0c77a;

    background:transparent;

    border:none;

    box-shadow:none;

    text-shadow:
        0 2px 8px rgba(240,199,122,.18);

    z-index:2;
}


/* ================= TOP BOTTOM ================= */

.top-bottom{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-top:20px;
}

.top-points{
    font-size:24px;

    font-weight:700;

    white-space:nowrap;
}


/* ================= VOTE BUTTON ================= */

.vote-btn{
    border:none;

    background:#fff;

    color:#111;

    min-width:145px;

    height:52px;

    padding:0 30px;

    border-radius:30px;

    font-size:19px;

    font-weight:600;

    cursor:pointer;

    transition:.15s;
}

.vote-btn:active{
    transform:scale(.94);
}


/* ================= NOTICE ================= */

.notice{
    background:rgba(35,42,67,.85);

    border-radius:14px;

    padding:17px 15px;

    text-align:center;

    font-size:16px;

    line-height:1.5;

    margin-bottom:23px;
}


/* ================= OTHER CARDS ================= */

.list{
    display:flex;

    flex-direction:column;

    gap:16px;
}

.card{
    width:100%;

    background:#000;

    border:2px solid #454545;

    border-radius:18px;

    padding:14px;

    display:flex;

    align-items:center;

    gap:16px;

    min-height:185px;

    box-shadow:
        0 7px 22px rgba(0,0,0,.25);
}

.card-photo{
    width:205px;

    height:155px;

    object-fit:cover;

    border-radius:13px;

    background:#202020;

    flex-shrink:0;
}

.card-content{
    position:relative;

    flex:1;

    min-width:0;

    height:155px;

    padding-top:3px;
}

.card-city{
    font-size:25px;

    font-weight:700;

    padding-right:55px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.card-name{
    color:#aaa;

    font-size:17px;

    margin-top:9px;

    padding-right:45px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================
   BEAUTIFUL RANK NUMBERS
========================================= */

.rank-number{
    position:absolute;

    right:4px;

    top:-4px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:46px;

    font-weight:400;

    font-style:italic;

    line-height:1;

    letter-spacing:-2px;

    color:#d9d9d9;

    background:transparent;

    border:none;

    border-radius:0;

    box-shadow:none;

    text-shadow:
        0 2px 7px rgba(255,255,255,.08);

    z-index:2;
}


/* ================= CARD BOTTOM ================= */

.card-bottom{
    position:absolute;

    left:0;
    right:0;

    bottom:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

.card-points{
    font-size:21px;

    font-weight:700;

    white-space:nowrap;
}


/* ================= ADMIN ================= */

.admin-open{
    text-align:center;

    margin-top:40px;
}

.lock-btn{
    width:45px;

    height:45px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.25);

    background:rgba(0,0,0,.25);

    color:#aaa;

    font-size:19px;

    cursor:pointer;
}

.pin-box,
.admin-panel{
    display:none;

    background:#101426;

    border:1px solid #454b65;

    border-radius:18px;

    margin-top:18px;

    padding:20px;
}

.pin-box h3,
.admin-panel h2{
    text-align:center;

    margin-bottom:16px;
}

.pin-input{
    width:100%;

    height:50px;

    border:none;

    border-radius:10px;

    background:#20253a;

    color:#fff;

    text-align:center;

    font-size:20px;

    letter-spacing:5px;

    outline:none;
}

.enter-btn{
    width:100%;

    height:48px;

    border:none;

    border-radius:10px;

    background:#fff;

    color:#111;

    font-weight:700;

    margin-top:10px;

    cursor:pointer;
}


/* ================= ADMIN ITEM ================= */

.admin-item{
    background:#05070e;

    border-radius:14px;

    padding:14px;

    margin-bottom:14px;
}

.admin-row{
    display:flex;

    gap:12px;

    align-items:flex-start;
}

.admin-photo{
    width:80px;

    height:80px;

    object-fit:cover;

    border-radius:10px;

    background:#222;

    flex-shrink:0;
}

.admin-fields{
    flex:1;
}

.admin-fields input{
    width:100%;

    height:43px;

    padding:0 10px;

    margin-bottom:7px;

    border:none;

    border-radius:8px;

    background:#20253a;

    color:#fff;

    outline:none;
}

.file-label{
    display:block;

    text-align:center;

    background:#29304a;

    padding:10px;

    border-radius:8px;

    cursor:pointer;

    font-size:14px;
}

.file-input{
    display:none;
}

.admin-actions{
    display:flex;

    gap:8px;

    margin-top:9px;
}

.admin-actions button{
    flex:1;

    height:42px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-weight:600;
}

.save-btn{
    background:#fff;

    color:#111;
}

.delete-btn{
    background:#982733;

    color:#fff;
}

.add-btn{
    width:100%;

    height:48px;

    border:none;

    border-radius:10px;

    background:#3158c8;

    color:#fff;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    margin-top:5px;
}

.close-btn{
    width:100%;

    height:45px;

    border:none;

    border-radius:10px;

    background:#292e40;

    color:#fff;

    cursor:pointer;

    margin-top:10px;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .container{
        padding:15px 9px 50px;
    }

    .logo h1{
        font-size:29px;
    }

    .logo-icon{
        width:70px;
        height:70px;

        font-size:27px;
    }

    .section-title{
        font-size:24px;
    }


    /* TOP */

    .top-one{
        padding:11px;

        border-radius:16px;
    }

    .top-photo{
        height:390px;

        border-radius:13px;
    }

    .top-city{
        font-size:24px;
    }

    .top-name{
        font-size:17px;
    }

    .top-number{
        right:5px;

        top:7px;

        font-size:52px;
    }

    .top-points{
        font-size:20px;
    }

    .top-bottom{
        gap:10px;
    }

    .vote-btn{
        min-width:120px;

        height:48px;

        padding:0 20px;

        font-size:17px;
    }


    /* OTHER */

    .card{
        min-height:145px;

        padding:10px;

        gap:12px;

        border-radius:15px;
    }

    .card-photo{
        width:125px;

        height:125px;

        border-radius:10px;
    }

    .card-content{
        height:125px;
    }

    .card-city{
        font-size:20px;

        padding-right:42px;
    }

    .card-name{
        font-size:14px;

        padding-right:35px;

        margin-top:6px;
    }

    .rank-number{
        right:2px;

        top:-3px;

        font-size:34px;
    }

    .card-points{
        font-size:18px;
    }

    .card .vote-btn{
        min-width:86px;

        height:43px;

        padding:0 12px;

        font-size:15px;
    }

    .admin-row{
        gap:9px;
    }

    .admin-photo{
        width:65px;

        height:65px;
    }
}
</style>
</head>


<body>

<div class="container">


<!-- ================= LOGO ================= -->

<div class="logo">

    <div class="logo-icon">
        FV
    </div>

    <h1>
        FRIEND VOTE
    </h1>

    <p>
        2026
    </p>

</div>


<div class="section-title">
    Contestants
</div>


<!-- ================= TOP 1 ================= -->

<div id="topOne"></div>


<div class="notice">

    Vote for your favorite contestant.<br>

    <b>1 Vote = 10 Points</b>

</div>


<!-- ================= LIST ================= -->

<div
    id="contestantList"
    class="list">
</div>


<!-- ================= ADMIN ================= -->

<div class="admin-open">

    <button
        class="lock-btn"
        onclick="openPin()">
        🔒
    </button>

</div>


<div
    id="pinBox"
    class="pin-box">

    <h3>
        Admin Access
    </h3>

    <input
        id="pinInput"
        class="pin-input"
        type="password"
        maxlength="4"
        inputmode="numeric"
        placeholder="PIN"
    >

    <button
        class="enter-btn"
        onclick="checkPin()">
        Enter
    </button>

</div>


<div
    id="adminPanel"
    class="admin-panel">

    <h2>
        Admin Panel
    </h2>

    <div id="adminList"></div>

    <button
        class="add-btn"
        onclick="addContestant()">
        + Add New Contestant
    </button>

    <button
        class="close-btn"
        onclick="closeAdmin()">
        Close Admin
    </button>

</div>

</div>


<script>

/* ==========================================
   SETTINGS
========================================== */

const ADMIN_PIN = "2013";

const VOTE_POINTS = 10;


/* ==========================================
   DEFAULT CONTESTANTS
   ALL POINTS = 0
========================================== */

const defaultContestants = [

    {
        id:1,
        city:"MYANMAR",
        name:"Friend One",
        points:0,
        image:""
    },

    {
        id:2,
        city:"MYANMAR",
        name:"Friend Two",
        points:0,
        image:""
    },

    {
        id:3,
        city:"MYANMAR",
        name:"Friend Three",
        points:0,
        image:""
    },

    {
        id:4,
        city:"MYANMAR",
        name:"Friend Four",
        points:0,
        image:""
    },

    {
        id:5,
        city:"MYANMAR",
        name:"Friend Five",
        points:0,
        image:""
    },

    {
        id:6,
        city:"MYANMAR",
        name:"Friend Six",
        points:0,
        image:""
    },

    {
        id:7,
        city:"MYANMAR",
        name:"Friend Seven",
        points:0,
        image:""
    },

    {
        id:8,
        city:"MYANMAR",
        name:"Friend Eight",
        points:0,
        image:""
    },

    {
        id:9,
        city:"MYANMAR",
        name:"Friend Nine",
        points:0,
        image:""
    },

    {
        id:10,
        city:"MYANMAR",
        name:"Friend Ten",
        points:0,
        image:""
    }

];


/* ==========================================
   LOAD DATA
========================================== */

let contestants =
    JSON.parse(
        localStorage.getItem(
            "friendVote2026"
        )
    ) || defaultContestants;


/* ==========================================
   FORCE INITIAL POINTS TO ZERO
========================================== */

if(
    !localStorage.getItem(
        "friendVote2026"
    )
){

    contestants.forEach(
        person => {
            person.points = 0;
        }
    );

    saveData();
}


/* ==========================================
   SAVE
========================================== */

function saveData(){

    localStorage.setItem(
        "friendVote2026",
        JSON.stringify(
            contestants
        )
    );

}


/* ==========================================
   SORT
========================================== */

function getSorted(){

    return [...contestants].sort(
        (a,b) =>
            Number(b.points || 0) -
            Number(a.points || 0)
    );

}


/* ==========================================
   FORMAT POINTS
========================================== */

function formatPoints(number){

    return Number(
        number || 0
    ).toLocaleString("en-US");

}


/* ==========================================
   IMAGE
========================================== */

function getImage(image){

    if(
        image &&
        image.trim() !== ""
    ){

        return image;

    }

    return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="500"
            height="500">

            <rect
                width="100%"
                height="100%"
                fill="#202020"/>

            <text
                x="50%"
                y="50%"
                dominant-baseline="middle"
                text-anchor="middle"
                fill="#777"
                font-size="30">

                PHOTO

            </text>

        </svg>

    `);

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   RENDER
========================================== */

function render(){

    const sorted =
        getSorted();

    const top =
        sorted[0];

    const topBox =
        document.getElementById(
            "topOne"
        );

    const list =
        document.getElementById(
            "contestantList"
        );


    if(!top){

        topBox.innerHTML = "";

        list.innerHTML = "";

        return;

    }


    /* ================= TOP 1 ================= */

    topBox.innerHTML = `

        <div class="top-one">

            <img
                class="top-photo"
                src="${getImage(top.image)}"
                alt=""
            >

            <div class="top-info">

                <div class="top-city">
                    ${escapeHTML(top.city)}
                </div>

                <div class="top-name">
                    ${escapeHTML(top.name)}
                </div>

                <div class="top-number">
                    1
                </div>

                <div class="top-bottom">

                    <div class="top-points">
                        ${formatPoints(top.points)} Points
                    </div>

                    <button
                        class="vote-btn"
                        onclick="vote(${top.id})">
                        Vote
                    </button>

                </div>

            </div>

        </div>

    `;


    /* ================= TOP 2+ ================= */

    let html = "";


    sorted
        .slice(1)
        .forEach(
            (person,index)=>{

                const rank =
                    index + 2;


                html += `

                    <div class="card">

                        <img
                            class="card-photo"
                            src="${getImage(person.image)}"
                            alt=""
                        >

                        <div class="card-content">

                            <div class="card-city">
                                ${escapeHTML(person.city)}
                            </div>

                            <div class="card-name">
                                ${escapeHTML(person.name)}
                            </div>

                            <div class="rank-number">
                                ${rank}
                            </div>

                            <div class="card-bottom">

                                <div class="card-points">
                                    ${formatPoints(person.points)} Points
                                </div>

                                <button
                                    class="vote-btn"
                                    onclick="vote(${person.id})">
                                    Vote
                                </button>

                            </div>

                        </div>

                    </div>

                `;

            }
        );


    list.innerHTML =
        html;

}


/* ==========================================
   VOTE
   1 VOTE = 10 POINTS
========================================== */

function vote(id){

    const person =
        contestants.find(
            item => item.id === id
        );


    if(!person){

        return;

    }


    person.points =
        Number(person.points || 0)
        + VOTE_POINTS;


    saveData();

    render();

}


/* ==========================================
   ADMIN PIN
========================================== */

function openPin(){

    document.getElementById(
        "pinBox"
    ).style.display = "block";

    document.getElementById(
        "adminPanel"
    ).style.display = "none";

    document.getElementById(
        "pinInput"
    ).value = "";

}


function checkPin(){

    const pin =
        document.getElementById(
            "pinInput"
        ).value;


    if(pin === ADMIN_PIN){

        document.getElementById(
            "pinBox"
        ).style.display = "none";

        document.getElementById(
            "adminPanel"
        ).style.display = "block";

        renderAdmin();

    }

    else{

        alert("Incorrect PIN");

    }

}


/* ==========================================
   ADMIN RENDER
========================================== */

function renderAdmin(){

    let html = "";


    contestants.forEach(
        person=>{

            html += `

                <div class="admin-item">

                    <div class="admin-row">

                        <img
                            id="preview-${person.id}"
                            class="admin-photo"
                            src="${getImage(person.image)}"
                        >

                        <div class="admin-fields">

                            <input
                                id="city-${person.id}"
                                value="${escapeHTML(person.city)}"
                                placeholder="City"
                            >

                            <input
                                id="name-${person.id}"
                                value="${escapeHTML(person.name)}"
                                placeholder="Name"
                            >

                            <input
                                id="points-${person.id}"
                                type="number"
                                min="0"
                                value="${person.points}"
                                placeholder="Points"
                            >

                            <label class="file-label">

                                📷 Choose Photo

                                <input
                                    class="file-input"
                                    type="file"
                                    accept="image/*"
                                    onchange="changePhoto(event,${person.id})"
                                >

                            </label>

                        </div>

                    </div>

                    <div class="admin-actions">

                        <button
                            class="save-btn"
                            onclick="saveContestant(${person.id})">
                            Save
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteContestant(${person.id})">
                            Delete
                        </button>

                    </div>

                </div>

            `;

        }
    );


    document.getElementById(
        "adminList"
    ).innerHTML = html;

}


/* ==========================================
   CHANGE PHOTO
========================================== */

function changePhoto(event,id){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const person =
                contestants.find(
                    item =>
                        item.id === id
                );


            if(!person){

                return;

            }


            person.image =
                e.target.result;


            const preview =
                document.getElementById(
                    "preview-" + id
                );


            if(preview){

                preview.src =
                    e.target.result;

            }

        };


    reader.readAsDataURL(file);

}


/* ==========================================
   SAVE CONTESTANT
========================================== */

function saveContestant(id){

    const person =
        contestants.find(
            item => item.id === id
        );


    if(!person){

        return;

    }


    person.city =
        document.getElementById(
            "city-" + id
        ).value.trim();


    person.name =
        document.getElementById(
            "name-" + id
        ).value.trim();


    person.points =
        Number(
            document.getElementById(
                "points-" + id
            ).value
        ) || 0;


    saveData();

    render();

    renderAdmin();

}


/* ==========================================
   DELETE
========================================== */

function deleteContestant(id){

    if(
        !confirm(
            "Delete this contestant?"
        )
    ){

        return;

    }


    contestants =
        contestants.filter(
            item => item.id !== id
        );


    saveData();

    render();

    renderAdmin();

}


/* ==========================================
   ADD NEW
========================================== */

function addContestant(){

    const newId =
        contestants.length
        ? Math.max(
            ...contestants.map(
                x => x.id
            )
          ) + 1
        : 1;


    contestants.push({

        id:newId,

        city:"MYANMAR",

        name:"New Friend",

        points:0,

        image:""

    });


    saveData();

    render();

    renderAdmin();

}


/* ==========================================
   CLOSE ADMIN
========================================== */

function closeAdmin(){

    document.getElementById(
        "adminPanel"
    ).style.display = "none";

}


/* ==========================================
   START
========================================== */

render();

</script>

</body>
</html>
